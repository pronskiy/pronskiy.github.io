# ─────────────────────────────────────────────────────────────────────────────
# Talks, podcasts and videos for the homepage archive and the /videos page.
# Rendered by source/_partials/archive-list.html, which merges these entries
# with Sculpin's own posts (data.posts) and the generated articles.yml into
# one reverse-chronological feed.
#
# RULES — read before editing:
#
#   1. `date` MUST be a full YYYY-MM-DD. Symfony's YAML parser turns it into a
#      UNIX timestamp, which is what lets it sort against Sculpin post dates
#      with no conversion. A bare `date: 2025` parses as the INTEGER 2025,
#      which sorts below every real timestamp and silently sinks the row to
#      the bottom of the page.
#
#   2. When only the year is known, give a plausible full date anyway and set
#      `date_display: "2025"` — that string is what actually renders, so the
#      synthetic month/day never shows. As of September 2026 every entry has a
#      real date (event date where known, otherwise the YouTube upload date).
#
#   3. `archive:` must be defined in THIS FILE ONLY. Site-config imports merge
#      lists by numeric index, so a second file defining `archive:` would
#      silently overwrite entries here one-for-one, not append to them.
#
#   4. The dev server does NOT watch this file (Sculpin's config watcher looks
#      at <project>/config, which doesn't exist here). Restart after editing.
#
# `type` is one of: talk · podcast · video. Articles (type `article`) live in
# articles.yml, which is generated; read its header before editing it.
#
# `projects:` below is a separate, undated list rendered by the Projects block.
# ─────────────────────────────────────────────────────────────────────────────

# `image` is a local illustration, website preview, or screenshot in assets/img/projects/.
# Keep the original website previews for PhpStorm Light and DAWhub.
# `featured: true` selects the three homepage projects; the first featured entry
# takes the lead spot with the big preview, the other two get compact rows.
# `thumb:` is an optional square image for a compact row, for previews whose
# centre crop reads badly (wide lettering, off-centre subjects).
# Illustrations are intentionally legible at thumbnail size, without live statistics.
# `status:` marks a project that is no longer active ("Archived", "Acquired by …"):
# its text is a muted note after the name and the preview loses its colour.
# Keep those last in the list.
projects:
  - name: DAWhub
    featured: true
    url: https://dawhub.app
    image: dawhub.jpg
    desc: "Diff and version control for FL Studio projects. Starting with a CLI for tracking what changed."

  - name: php-debugger
    featured: true
    url: https://github.com/php-debugger/php-debugger
    image: php-debugger.svg
    desc: "A lightweight PHP debugger extension, forked from Xdebug and stripped down to debugging only."

  - name: PhpStorm Light
    featured: true
    url: https://phpstorm.dev/light-mode
    image: phpstorm-light.jpg
    thumb: phpstorm-light-square.jpg   # the compact row's square crop lost the lettering
    desc: "An experimental, trimmed-down PhpStorm build: faster startup, lower memory, fewer bundled features."

  - name: The PHP Foundation
    url: https://thephp.foundation
    image: thephp-foundation.jpg
    desc: "The non-profit that funds PHP core development. I founded it in 2021 and led it as its first Executive Director until 2026."

  - name: MCP PHP SDK
    url: https://github.com/modelcontextprotocol/php-sdk
    image: mcp-php-sdk.svg
    desc: "The official PHP SDK for the Model Context Protocol, built by Symfony and The PHP Foundation. I initiated it with Anthropic and coordinated it through the Foundation."

  - name: redpen
    url: https://github.com/pronskiy/redpen
    image: redpen-preview.png
    image_fit: contain
    desc: "A macOS menu-bar app that critiques your English instead of correcting it."

  - name: redditify
    url: https://github.com/pronskiy/redditify
    image: redditify.svg
    desc: "Render Reddit threads on your own website."

  - name: php-src-developer
    url: https://github.com/pronskiy/php-src-developer
    image: php-src-developer.svg
    desc: "A Claude Code plugin for working on the PHP language core, php/php-src."

  - name: PHP Typehints Extra
    url: https://plugins.jetbrains.com/plugin/32595-php-typehints-extra
    image: php-typehints-extra.svg
    desc: "A PhpStorm plugin that adds extra type-hinting capabilities to PHP code."

  - name: PHP Digest
    url: https://t.me/phpdigest
    image: php-digest.svg
    desc: "A Russian-language PHP newsletter I ran from 2012 to 2022: 222 issues on Habr. It lives on as a monthly Telegram channel maintained by the community. PHP Annotated grew out of it."

  - name: Elephpant Progress Bar
    url: https://plugins.jetbrains.com/plugin/15291-elephpant-progress-bar
    image: elephpant-progress-bar.svg
    desc: "A PhpStorm plugin that replaces the progress bar with an elephpant."

  - name: PHP 8.0 release page
    url: https://www.php.net/releases/8.0/en.php
    image: php-8-release-page.jpg
    desc: "The php.net page that announced PHP 8.0. I proposed it, designed it with Alexander Makarov and Svetlana Belozerova, and shipped it; the template served every release through 8.4."

  - name: 25 Years of PHP
    url: https://www.jetbrains.com/lp/php-25/
    image: php-25.jpg
    desc: "A timeline of PHP's history for the language's 25th birthday in 2020, with the data open-sourced and reviewed by core contributors."

  - name: mcp
    url: https://github.com/pronskiy/mcp
    image: mcp.svg
    desc: "The fast, PHP way to build MCP servers: tools, resources and prompts in plain PHP."
    status: Archived

  - name: phpup
    url: https://github.com/pronskiy/phpup
    image: phpup.svg
    desc: "A single-file PHP toolchain: Composer and other tools without PHP installed on the machine."
    status: Archived

  - name: Search Exclude
    url: https://wordpress.org/plugins/search-exclude/
    image: search-exclude.svg
    desc: "A WordPress plugin that hides chosen pages and posts from search results."
    status: Acquired by QuadLayers in 2023
