# note the provenance so it can be regenerated:
#
#   PhpStorm blog   WordPress REST API, author id 869 (slug rpronskiy):
#                   https://blog.jetbrains.com/wp-json/wp/v2/posts?author=869&per_page=100&page=N
#                   Titles are HTML-entity decoded. Selection: keep a title if it
#                   matches /\b(Video|Episode)\b/i; otherwise drop it if it matches
#                   /\bEAP\b|Early Access|\bBeta\b|\bPreview\b|\bRC\s?\d*\b|Release Candidate|\b(?:is|are)\s+(?:now\s+)?(?:released|available|out)\b|Has Been Released|\bReleased:|^PhpStorm \d{4}\.\d|What.s New In PhpStorm/i
#                   (release notices are out: EAP, beta, preview, RC, patch and
#                   x.y release announcements); keep everything else.
#   PHP Foundation  https://github.com/ThePHPF/thephp.foundation, source/_posts/*.md
#                   whose front matter lists `roman-pronskiy` under `author`. Date and
#                   slug come from the filename; URL is /blog/YYYY/MM/DD/slug/.
#
# Same rules as archive.yml: `date` MUST be a full YYYY-MM-DD (unquoted, so YAML
# parses it to a timestamp that sorts against post dates), and `articles:` must
# be defined in THIS FILE ONLY. Newest first.
