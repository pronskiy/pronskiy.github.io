<div class="archive-tools" data-archive-tools hidden>
    <div class="archive-filters" role="group" aria-label="Filter by type">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        {% if with_writing %}<button type="button" data-filter="writing" aria-pressed="false">Writing</button>{% endif %}
        <button type="button" data-filter="talk" aria-pressed="false">Talks</button>
        <button type="button" data-filter="podcast" aria-pressed="false">Podcasts</button>
        <button type="button" data-filter="video" aria-pressed="false">Videos</button>
    </div>
    <p class="archive-count" data-archive-count role="status" aria-live="polite" aria-atomic="true"></p>
</div>
